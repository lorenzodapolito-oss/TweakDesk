[package]
name = "tweakdesk"
version = "2.7.3"
edition = "2021"
description = "TweakDesk - impostazioni di Windows, programmi, estensioni, script, pulizia, avvio automatico e backup di sistema"
authors = ["Lorenzo D'Apolito"]
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wgpu", "wayland", "x11"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = "0.4"
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust = "0.6.1"

[dev-dependencies]
sevenz-rust = { version = "0.6.1", features = ["compress"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
